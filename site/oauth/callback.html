<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Returning to RTS</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a0f;color:#f5f5f7}.card{width:min(420px,calc(100% - 32px));padding:28px;border:1px solid #292c38;border-radius:24px;background:rgba(22,24,32,.94);box-shadow:0 28px 80px rgba(0,0,0,.5);text-align:center}.orb{width:58px;height:58px;margin:0 auto;border-radius:19px;background:linear-gradient(145deg,#a694ff,#5d54e8);box-shadow:0 18px 46px rgba(113,94,255,.34);animation:pulse 1.25s ease-in-out infinite}.card h1{font-size:21px;margin:18px 0 8px}.card p{font-size:13px;line-height:1.55;color:#a8adbb;margin:0}.bar{height:4px;margin:22px 0 18px;border-radius:99px;background:#2b2e3a;overflow:hidden}.bar i{display:block;width:45%;height:100%;border-radius:inherit;background:#8d7cff;animation:move 1.1s ease-in-out infinite}.actions{display:none;gap:10px;justify-content:center}.actions.show{display:flex}.actions button{border:0;border-radius:12px;padding:11px 15px;font:inherit;font-weight:650;cursor:pointer}.primary{background:#f4f4f7;color:#11131a}.secondary{background:#2b2e39;color:#f4f4f7}@keyframes pulse{50%{transform:scale(.93);opacity:.78}}@keyframes move{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}@media(prefers-reduced-motion:reduce){.orb,.bar i{animation:none}}
  </style>
</head>
<body>
  <main class="card">
    <div class="orb" aria-hidden="true"></div>
    <h1 id="title">Returning to RTS</h1>
    <p id="detail">Keep RTS open. This page is securely handing the authorization result back to the local application.</p>
    <div class="bar"><i></i></div>
    <div class="actions" id="actions">
      <button class="primary" id="retry">Try again</button>
      <button class="secondary" id="close">Close</button>
    </div>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const allowed = ["code", "state", "error", "error_description"];
      const forwarded = new URLSearchParams();
      for (const key of allowed) {
        const value = params.get(key);
        if (value) forwarded.set(key, value);
      }

      const title = document.getElementById("title");
      const detail = document.getElementById("detail");
      const actions = document.getElementById("actions");
      const localTarget = `http://127.0.0.1:6970/api/v1/oauth/callback?${forwarded.toString()}`;
      let attempts = 0;

      function redirect() {
        attempts += 1;
        location.replace(localTarget);
        if (attempts >= 2) {
          setTimeout(() => {
            title.textContent = "RTS did not answer";
            detail.textContent = "Open RTS, then press Try again. No authorization data is stored on this page.";
            actions.classList.add("show");
          }, 2200);
        }
      }

      document.getElementById("retry").addEventListener("click", redirect);
      document.getElementById("close").addEventListener("click", () => window.close());

      if (!forwarded.has("state")) {
        title.textContent = "Invalid authorization response";
        detail.textContent = "The state parameter is missing. Return to RTS and start the connection again.";
        actions.classList.add("show");
        document.getElementById("retry").style.display = "none";
        return;
      }

      setTimeout(redirect, 180);
    })();
  </script>
</body>
</html>
